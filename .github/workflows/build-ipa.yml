# Unsigned SFI IPA. Actions → Build unsigned IPA → Run workflow.
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Clone sources
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SagerNet/sing-box.git sing-box
          git clone --depth 1 --branch dev --recurse-submodules \
            https://github.com/SagerNet/sing-box-for-apple.git sing-box-for-apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Install gomobile
        working-directory: sing-box
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile version || true
          gomobile init

      - name: Build Libbox
        working-directory: sing-box
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          if [ ! -d ../sing-box-for-apple/Libbox.xcframework ]; then
            test -d Libbox.xcframework
            mv Libbox.xcframework ../sing-box-for-apple/
          fi
          shopt -s nullglob
          for framework in ../sing-box-for-apple/Libbox.xcframework/ios-*/Libbox.framework; do
            if [ -d "$framework/Versions/A" ]; then
              shallow="${framework}.shallow"
              rm -rf "$shallow"
              ditto "$framework/Versions/A" "$shallow"
              rm -rf "$framework"
              mv "$shallow" "$framework"
            fi
          done
          test -d ../sing-box-for-apple/Libbox.xcframework
          ls -la ../sing-box-for-apple/Libbox.xcframework

      - name: Show Xcode
        run: |
          echo "RUNNER=macos-26"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build SFI unsigned
        working-directory: sing-box-for-apple
        env:
          DISABLE_SWIFTLINT: "1"
        run: |
          set -euo pipefail
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "SFI .app not found"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" | head -20
            exit 1
          fi
          echo "APP=$APP"
          find "$APP" -name "*.appex" -print
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP")"
          (
            cd "$RUNNER_TEMP/ipa"
            zip -qry "$GITHUB_WORKSPACE/SFI-unsigned.ipa" Payload
          )
          ls -lh "$GITHUB_WORKSPACE/SFI-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-macos-26
          path: SFI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
